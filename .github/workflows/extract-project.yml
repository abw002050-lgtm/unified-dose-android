name: Extract Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-project:
    name: Extract and Verify Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Verify ZIP file
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="unified-dose-android-starter.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP file was not found."
            exit 1
          fi

          echo "ZIP file found."

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/unified-dose-project

          unzip -o unified-dose-android-starter.zip \
            -d /tmp/unified-dose-project

          echo "Project archive extracted."

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT="/tmp/unified-dose-project"

          SETTINGS_FILE="$(
            find "$ROOT" -type f \
              \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -print -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App Gradle file was not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml was not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project structure verified."
          echo "Project directory: $PROJECT_DIR"

      - name: Copy project files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "Copying Android project files..."

          cp -a "$PROJECT_DIR"/. .

          echo "Project files copied."

      - name: Verify extracted files
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle ||
            test -f settings.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          test -f app/build.gradle ||
            test -f app/build.gradle.kts

          echo "Required Android files are present."

      - name: Commit project files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # لا نحاول إنشاء أو تعديل ملفات GitHub Actions
          # باستخدام رمز وصول لا يملك صلاحية workflows.
          git add -A

          git reset -- \
            .github/workflows/build-apk.yml \
            .github/workflows/extract-project.yml

          if git diff --cached --quiet; then
            echo "No project changes to commit."
          else
            git commit -m "Extract Android starter project"
            git push origin HEAD:main
          fi

      - name: Extraction summary
        if: success()
        shell: bash
        run: |
          echo "Project extraction completed successfully."
          echo "Android project files were verified."
          echo "GitHub Actions files were left unchanged."
